<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orçamento | Reserva Araras</title>
  <style>
    :root{--ink:#17362e;--forest:#245747;--leaf:#83a95d;--paper:#fffdf8;--cream:#f5f1e7;--line:#d9ded2;--gold:#d5a84f;--muted:#687a73;--shadow:0 18px 45px rgba(22,51,43,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:1rem;background:var(--cream);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(760px,100%);margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.4rem;box-shadow:var(--shadow)}.eyebrow{margin:0;color:#367565;font-size:.68rem;font-weight:800;letter-spacing:.14em}.card h1{margin:.2rem 0 .3rem;font:600 1.6rem Georgia,serif}.muted{color:var(--muted)}.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;align-items:end;min-height:230px;padding:1rem .5rem;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}.cycle{display:grid;grid-template-rows:1fr auto;gap:.5rem;height:200px;text-align:center}.bars{display:flex;align-items:end;justify-content:center;gap:5px;height:100%}.bar{width:24px;min-height:2px;border-radius:6px 6px 0 0;background:var(--forest);height:var(--height)}.bar.expense{background:var(--gold)}.cycle-label{font-size:.72rem;color:var(--muted)}.legend{display:flex;gap:1rem;margin:.8rem 0;color:var(--muted);font-size:.75rem}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.3rem}.legend .income{background:var(--forest)}.legend .expense{background:var(--gold)}.impact{display:flex;align-items:center;gap:.8rem;padding:.8rem;background:#f4efe1;border-left:3px solid var(--gold);border-radius:0 9px 9px 0}.impact label{font-size:.8rem;font-weight:800}.impact input{width:110px}.impact strong{color:var(--forest)}.table-wrap{overflow:auto;margin-top:1rem}.table{width:100%;border-collapse:collapse;font-size:.8rem}.table th,.table td{text-align:right;padding:.55rem;border-bottom:1px solid var(--line)}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--muted);font-size:.7rem}.chart:focus-visible,.impact input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:520px){.chart{gap:.25rem}.bar{width:16px}.impact{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <section class="card" data-component="budget-graph"><p class="eyebrow">INDICADORES DO MODELO</p><h1>Fluxo de orçamento</h1><p class="muted">Compare entradas e despesas didáticas por ciclo. O gráfico não representa contabilidade real.</p><div id="budgetChart" class="chart" tabindex="0" role="img" aria-label="Gráfico de orçamento"></div><div class="legend"><span><i class="income"></i>Orçamento disponível</span><span><i class="expense"></i>Intervenções</span></div><div class="impact"><label for="taxImpact">Cenário de impacto (%)</label><input id="taxImpact" type="range" min="0" max="30" value="0"><strong id="impactValue">Sem ajuste</strong></div><div class="table-wrap"><table class="table"><caption class="sr-only">Dados do orçamento por ciclo</caption><thead><tr><th>Ciclo</th><th>Disponível</th><th>Intervenções</th><th>Saldo</th></tr></thead><tbody id="budgetTable"></tbody></table></div></section>
  <script>
    (() => {
      'use strict';
      const defaultData = [{ label: 'Inicial', income: 50000, expense: 0 }, { label: 'Teste 1', income: 45500, expense: 4500 }, { label: 'Teste 2', income: 43700, expense: 1800 }, { label: 'Teste 3', income: 40500, expense: 3200 }]; const chart = document.querySelector('#budgetChart'); const table = document.querySelector('#budgetTable'); const impact = document.querySelector('#taxImpact'); const impactValue = document.querySelector('#impactValue'); let currentData = defaultData;
      function number(value) { const parsed = Number(value); return Number.isFinite(parsed) && parsed >= 0 ? parsed : 0; }
      function renderIncomeExpenseChart(data = defaultData) { currentData = Array.isArray(data) && data.length ? data.map(item => ({ label: String(item.label || 'Ciclo'), income: number(item.income), expense: number(item.expense) })) : defaultData; const max = Math.max(1, ...currentData.flatMap(item => [item.income, item.expense])); chart.replaceChildren(); table.replaceChildren(); currentData.forEach(item => { const cycle = document.createElement('div'); cycle.className = 'cycle'; const bars = document.createElement('div'); bars.className = 'bars'; [['income', item.income], ['expense', item.expense]].forEach(([kind, value]) => { const bar = document.createElement('i'); bar.className = `bar ${kind === 'expense' ? 'expense' : ''}`; bar.style.setProperty('--height', `${Math.max(2, value / max * 100)}%`); bar.title = `${kind === 'expense' ? 'Intervenções' : 'Disponível'}: ${formatMoney(value)}`; bars.appendChild(bar); }); const label = document.createElement('span'); label.className = 'cycle-label'; label.textContent = item.label; cycle.append(bars, label); chart.appendChild(cycle); const row = document.createElement('tr'); [item.label, formatMoney(item.income), formatMoney(item.expense), formatMoney(Math.max(0, item.income - item.expense))].forEach(value => { const cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell); }); table.appendChild(row); }); animateGraphTransition(); return currentData; }
      function visualizeTaxImpact(rate = impact.value) { const value = Math.max(0, Math.min(30, Number(rate) || 0)); impact.value = value; impactValue.textContent = value ? `Ajuste didático de ${value}%` : 'Sem ajuste'; return value; }
      function animateGraphTransition() { chart.classList.remove('updated'); void chart.offsetWidth; chart.classList.add('updated'); }
      function formatMoney(value) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(number(value)); }
      impact.addEventListener('input', () => visualizeTaxImpact()); renderIncomeExpenseChart();
      window.ReservaBudgetGraph = { renderIncomeExpenseChart, visualizeTaxImpact, animateGraphTransition }; window.renderIncomeExpenseChart = renderIncomeExpenseChart; window.visualizeTaxImpact = visualizeTaxImpact; window.animateGraphTransition = animateGraphTransition;
    })();
  </script>
</body>
</html>
