<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Histórico | Reserva Araras</title>
  <style>
    :root{--ink:#17362e;--forest:#245747;--paper:#fffdf8;--cream:#f5f1e7;--line:#d9ded2;--gold:#d5a84f;--muted:#687a73;--shadow:0 18px 45px rgba(22,51,43,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:1rem;background:var(--cream);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(680px,100%);margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.4rem;box-shadow:var(--shadow)}.eyebrow{margin:0;color:#367565;font-size:.68rem;font-weight:800;letter-spacing:.14em}.card h1{margin:.2rem 0 .3rem;font:600 1.6rem Georgia,serif}.muted{color:var(--muted)}.form{display:grid;grid-template-columns:130px 140px 1fr auto;gap:.5rem;margin:1rem 0}.form input,.form select{min-width:0;border:1px solid #cbd5cc;border-radius:8px;padding:.6rem;background:#fff;color:var(--ink)}.button{border:0;border-radius:8px;padding:.6rem .8rem;background:var(--forest);color:#fff;font:inherit;font-weight:800;cursor:pointer}.timeline{position:relative;max-height:390px;overflow:auto;padding:.4rem .5rem .4rem 1.3rem;border-left:2px solid #bed0bd}.event{position:relative;margin:0 0 1rem;padding:.75rem;border:1px solid var(--line);border-radius:10px;background:#fbfcf7}.event:before{content:"";position:absolute;left:-1.75rem;top:1rem;width:10px;height:10px;border-radius:50%;background:var(--gold);border:3px solid var(--paper);box-shadow:0 0 0 1px #bed0bd}.event header{display:flex;justify-content:space-between;gap:1rem}.event strong{font-size:.82rem}.event time{color:var(--muted);font-size:.72rem}.event p{margin:.35rem 0 0;color:var(--muted)}.empty{color:var(--muted);padding:.5rem 0}.button:focus-visible,.form input:focus-visible,.form select:focus-visible,.timeline:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:620px){.form{grid-template-columns:1fr 1fr}.form input[type=date],.form input[type=text],.form .button{grid-column:1/-1}}
  </style>
</head>
<body>
  <section class="card" data-component="history"><p class="eyebrow">MEMÓRIA DA INVESTIGAÇÃO</p><h1>Histórico de eventos</h1><p class="muted">Registre mudanças e observações para comparar versões do mapa.</p><form id="historyForm" class="form"><label class="sr-only" for="eventDate">Data</label><input id="eventDate" type="date" required><label class="sr-only" for="eventType">Tipo</label><select id="eventType"><option value="observacao">Observação</option><option value="intervencao">Intervenção</option><option value="reflexao">Reflexão</option></select><label class="sr-only" for="eventText">Descrição</label><input id="eventText" type="text" maxlength="240" required placeholder="O que aconteceu neste teste?"><button class="button" type="submit">Registrar</button></form><div id="timeline" class="timeline" tabindex="0" aria-live="polite"></div></section>
  <script>
    (() => {
      'use strict';
      const form = document.querySelector('#historyForm'); const dateInput = document.querySelector('#eventDate'); const typeInput = document.querySelector('#eventType'); const textInput = document.querySelector('#eventText'); const timeline = document.querySelector('#timeline'); let events = [];
      dateInput.value = new Date().toISOString().slice(0, 10);
      function renderTimeline(items = events) { events = Array.isArray(items) ? items.slice(-30) : []; timeline.replaceChildren(); if (!events.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'Nenhum evento registrado.'; timeline.appendChild(empty); return events; } events.slice().reverse().forEach(event => { const article = document.createElement('article'); article.className = 'event'; const header = document.createElement('header'); const title = document.createElement('strong'); title.textContent = String(event.type || 'Evento'); const time = document.createElement('time'); time.dateTime = String(event.date || ''); time.textContent = formatDate(event.date); header.append(title, time); const text = document.createElement('p'); text.textContent = String(event.text || ''); article.append(header, text); timeline.appendChild(article); }); return events; }
      function addHistoricEvent(date, type, text) { const cleanText = String(text || '').trim().slice(0, 240); if (!cleanText) return false; events.push({ date: String(date || new Date().toISOString().slice(0, 10)), type: String(type || 'observacao').slice(0, 30), text: cleanText }); renderTimeline(); return true; }
      function scrollHistory(direction = 1) { timeline.scrollBy({ top: Number(direction) * Math.max(100, timeline.clientHeight * .75), behavior: 'smooth' }); }
      function formatDate(value) { const parsed = new Date(`${value}T12:00:00`); return Number.isNaN(parsed.getTime()) ? 'Data desconhecida' : parsed.toLocaleDateString('pt-BR'); }
      form.addEventListener('submit', event => { event.preventDefault(); if (addHistoricEvent(dateInput.value, typeInput.value, textInput.value)) textInput.value = ''; }); renderTimeline(); window.ReservaHistory = { renderTimeline, addHistoricEvent, scrollHistory }; window.renderTimeline = renderTimeline; window.addHistoricEvent = addHistoricEvent; window.scrollHistory = scrollHistory;
    })();
  </script>
</body>
</html>
