<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa | Reserva Araras</title>
  <style>
    :root{--ink:#17362e;--forest:#245747;--paper:#fffdf8;--cream:#f5f1e7;--line:#d9ded2;--muted:#687a73;--gold:#d5a84f;--shadow:0 18px 45px rgba(22,51,43,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:1rem;background:var(--cream);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(780px,100%);margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.4rem;box-shadow:var(--shadow)}.eyebrow{margin:0;color:#367565;font-size:.68rem;font-weight:800;letter-spacing:.14em}.card h1{margin:.2rem 0 .3rem;font:600 1.65rem Georgia,serif}.muted{color:var(--muted)}.map{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;aspect-ratio:4/3;padding:4px;background:#b1bda7;border-radius:10px}.tile{position:relative;min-width:0;border:0;border-radius:3px;color:transparent;cursor:pointer}.tile.native{background:#a9bd75}.tile.saf{background:#9f9960}.tile.reserve{background:#547845}.tile.trail{background:#7e9a62}.tile.water{background:#79aeb3}.tile.native:after,.tile.reserve:after{content:'•';position:absolute;inset:20%;font-size:1.8rem;line-height:1;color:rgba(23,54,46,.38)}.tile.water:after{content:'≈';position:absolute;inset:20%;font-size:1.3rem;color:rgba(255,255,255,.75)}.tile.selected{outline:3px solid var(--gold);outline-offset:-3px;z-index:1}.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px;z-index:2}.legend{display:flex;flex-wrap:wrap;gap:.8rem 1rem;margin:.9rem 0 0;color:var(--muted);font-size:.75rem}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.3rem}.native{background:#a9bd75}.legend .saf{background:#9f9960}.legend .reserve{background:#547845}.legend .trail{background:#7e9a62}.legend .water{background:#79aeb3}.status{min-height:1.5em;margin:.8rem 0 0;color:var(--muted);font-size:.78rem}.button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:520px){.card{padding:1rem}.map{gap:2px}}
  </style>
</head>
<body>
  <main class="card" data-component="map-renderer"><p class="eyebrow">OBSERVAÇÃO DO TERRITÓRIO</p><h1>Mapa da reserva</h1><p class="muted">Selecione uma parcela para conhecer sua posição no modelo. As cores são apoio visual, não classificação do território real.</p><div id="mapGrid" class="map" role="grid" aria-label="Mapa com 48 parcelas"></div><div class="legend" aria-label="Legenda do mapa"><span><i class="native"></i>Nativa</span><span><i class="saf"></i>SAF</span><span><i class="reserve"></i>Reserva</span><span><i class="trail"></i>Trilha</span><span><i class="water"></i>Água</span></div><p id="mapStatus" class="status" role="status" aria-live="polite"></p></main>
  <script>
    (() => {
      'use strict';
      const root = document.querySelector('#mapGrid'); const status = document.querySelector('#mapStatus'); const labels = { native: 'vegetação nativa', saf: 'sistema agroflorestal', reserve: 'reserva', trail: 'trilha', water: 'água' }; let selected = -1;
      function normalizeTiles(data) { const tiles = Array.isArray(data) ? data : data && Array.isArray(data.tiles) ? data.tiles : []; return Array.from({ length: 48 }, (_, index) => { const value = tiles[index] && typeof tiles[index] === 'object' ? String(tiles[index].type || 'native') : 'native'; return { type: labels[value] ? value : 'native' }; }); }
      function handleMouseClick(index) { const tile = root.children[index]; if (!tile) return null; selected = index; [...root.children].forEach((item, itemIndex) => item.classList.toggle('selected', itemIndex === index)); const data = { index, row: Math.floor(index / 8) + 1, column: index % 8 + 1, type: tile.dataset.type }; status.textContent = `Parcela ${index + 1}: ${labels[data.type]}.`; window.dispatchEvent(new CustomEvent('reserva:tile-select', { detail: data })); return data; }
      function renderTileGrid(mapData) { root.replaceChildren(); normalizeTiles(mapData).forEach((tile, index) => { const button = document.createElement('button'); button.type = 'button'; button.className = `tile ${tile.type}`; button.dataset.type = tile.type; button.dataset.index = String(index); button.setAttribute('role', 'gridcell'); button.setAttribute('aria-label', `Parcela ${index + 1}: ${labels[tile.type]}`); button.addEventListener('click', () => handleMouseClick(index)); root.appendChild(button); }); selected = -1; status.textContent = '48 parcelas prontas para observação.'; return root.children.length; }
      root.addEventListener('keydown', event => { if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)) return; const current = Number(event.target.dataset.index); if (!Number.isInteger(current)) return; event.preventDefault(); const offset = event.key === 'ArrowUp' ? -8 : event.key === 'ArrowDown' ? 8 : event.key === 'ArrowLeft' ? -1 : 1; const next = Math.max(0, Math.min(47, current + offset)); root.children[next].focus(); });
      renderTileGrid(); window.ReservaMap = { renderTileGrid, handleMouseClick }; window.renderTileGrid = renderTileGrid; window.handleMouseClick = handleMouseClick;
    })();
  </script>
</body>
</html>
