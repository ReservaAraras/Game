<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atividades | Reserva Araras</title>
  <style>
    :root{--ink:#17362e;--forest:#245747;--paper:#fffdf8;--cream:#f5f1e7;--line:#d9ded2;--gold:#d5a84f;--rust:#923e2c;--muted:#687a73;--shadow:0 18px 45px rgba(22,51,43,.16)}*{box-sizing:border-box}body{display:grid;place-items:center;margin:0;min-height:100vh;padding:1rem;background:var(--cream);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.dialog{width:min(650px,100%);max-height:calc(100vh - 2rem);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1.35rem 1.5rem 1rem;border-bottom:1px solid var(--line)}.eyebrow{margin:0;color:#367565;font-size:.68rem;font-weight:800;letter-spacing:.14em}.header h1{margin:.2rem 0 0;font:600 1.65rem Georgia,serif}.close{border:0;border-radius:50%;width:34px;height:34px;background:#edf0e9;color:var(--ink);font-size:1.25rem;cursor:pointer}.content{padding:1.25rem 1.5rem}.save-form{display:flex;gap:.6rem;margin-bottom:1rem}.save-form input{flex:1;min-width:0;border:1px solid #cbd5cc;border-radius:9px;padding:.7rem;background:#fff;color:var(--ink)}.button{border:0;border-radius:9px;padding:.7rem 1rem;font:inherit;font-weight:800;cursor:pointer}.button.primary{background:var(--forest);color:#fff}.button.ghost{background:transparent;border:1px solid #cbd5cc;color:var(--ink)}.button.danger{background:#f6e4de;color:var(--rust)}.save-list{display:grid;gap:.6rem}.save-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid var(--line);border-radius:10px;padding:.8rem}.save-row div{display:grid;min-width:0}.save-row strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.save-row small,.empty,.status{color:var(--muted);font-size:.78rem}.row-actions{display:flex;gap:.4rem;flex:none}.row-actions button{border:0;border-radius:7px;padding:.5rem .65rem;font:inherit;font-weight:700;cursor:pointer;background:#e5eadf;color:var(--ink)}.status{min-height:1.4em;margin:.75rem 0 0}.close:focus-visible,.button:focus-visible,.save-form input:focus-visible,.row-actions button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:520px){.header,.content{padding-left:1rem;padding-right:1rem}.save-form{flex-direction:column}.save-row{align-items:flex-start;flex-direction:column}.row-actions{width:100%}.row-actions button{flex:1}}
  </style>
</head>
<body>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="saveTitle" data-component="save-load"><header class="header"><div><p class="eyebrow">CADERNO DE INVESTIGAÇÃO</p><h1 id="saveTitle">Atividades salvas</h1></div><button class="close" type="button" aria-label="Fechar atividades" data-action="close">×</button></header><div class="content"><form id="saveForm" class="save-form"><label class="sr-only" for="saveName">Nome da atividade</label><input id="saveName" maxlength="60" required placeholder="Nome desta investigação"><button class="button primary" type="submit">Salvar cópia</button></form><div id="saveList" class="save-list" aria-live="polite"></div><p id="saveStatus" class="status" role="status"></p></div></section>
  <script>
    (() => {
      'use strict';
      const list = document.querySelector('#saveList'); const form = document.querySelector('#saveForm'); const status = document.querySelector('#saveStatus'); const fallbackKey = 'reserva_araras_demo_saves';
      function server(method, ...args) { if (!window.google?.script?.run) return Promise.reject(new Error('Backend indisponível neste modo de pré-visualização.')); return new Promise((resolve, reject) => { const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(String(error?.message || error)))); runner[method](...args); }); }
      function fallbackSaves() { try { return JSON.parse(localStorage.getItem(fallbackKey) || '[]'); } catch (_) { return []; } }
      function renderSaves(saves) { list.replaceChildren(); if (!saves.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'Nenhuma atividade salva ainda.'; list.appendChild(empty); return; } saves.forEach(save => { const row = document.createElement('div'); row.className = 'save-row'; const info = document.createElement('div'); const name = document.createElement('strong'); name.textContent = String(save.name || 'Sem nome'); const date = document.createElement('small'); date.textContent = save.updatedAt ? new Date(save.updatedAt).toLocaleString('pt-BR') : 'Data desconhecida'; info.append(name, date); const actions = document.createElement('span'); actions.className = 'row-actions'; const open = document.createElement('button'); open.type = 'button'; open.textContent = 'Abrir'; open.dataset.action = 'load'; open.dataset.id = save.id; const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = 'Excluir'; remove.dataset.action = 'delete'; remove.dataset.id = save.id; actions.append(open, remove); row.append(info, actions); list.appendChild(row); }); }
      async function listSavedFazendas() { status.textContent = 'Carregando atividades…'; try { const token = sessionStorage.getItem('reserva_token'); const saves = await server('listSaves', token); renderSaves(Array.isArray(saves) ? saves : []); status.textContent = ''; return saves; } catch (error) { const saves = fallbackSaves(); renderSaves(saves); status.textContent = saves.length ? 'Modo de pré-visualização: dados locais.' : error.message; return saves; } }
      async function confirmSaveAction(event) { event?.preventDefault(); const name = form.saveName.value.trim(); if (!name) return; const token = sessionStorage.getItem('reserva_token'); const state = window.reservaGameState || { budget: 50000, tiles: Array.from({ length: 48 }, () => ({ type: 'native' })), journal: {} }; try { await server('saveGame', token, { name, state }); status.textContent = 'Atividade salva.'; form.reset(); await listSavedFazendas(); } catch (_) { const saves = fallbackSaves(); saves.unshift({ id: `local-${Date.now()}`, name, updatedAt: new Date().toISOString() }); localStorage.setItem(fallbackKey, JSON.stringify(saves.slice(0, 20))); status.textContent = 'Salva apenas neste navegador.'; renderSaves(saves); } }
      async function loadSelectedSlot(id) { const token = sessionStorage.getItem('reserva_token'); try { const saved = await server('loadGame', token, id); window.dispatchEvent(new CustomEvent('reserva:save-loaded', { detail: saved })); status.textContent = 'Atividade carregada.'; } catch (error) { status.textContent = error.message; } }
      async function deleteSelectedSlot(id) { if (!window.confirm('Excluir esta atividade?')) return; const token = sessionStorage.getItem('reserva_token'); try { await server('deleteGame', token, id); await listSavedFazendas(); } catch (_) { const saves = fallbackSaves().filter(save => save.id !== id); localStorage.setItem(fallbackKey, JSON.stringify(saves)); renderSaves(saves); status.textContent = 'Registro local excluído.'; } }
      form.addEventListener('submit', confirmSaveAction); list.addEventListener('click', event => { const button = event.target.closest('[data-action]'); if (!button) return; if (button.dataset.action === 'load') loadSelectedSlot(button.dataset.id); if (button.dataset.action === 'delete') deleteSelectedSlot(button.dataset.id); }); document.addEventListener('click', event => { if (event.target.closest('[data-action="close"]')) window.dispatchEvent(new CustomEvent('reserva:save-dialog-close')); }); listSavedFazendas();
      window.ReservaSaveLoad = { listSavedFazendas, confirmSaveAction, loadSelectedSlot, deleteSelectedSlot }; window.listSavedFazendas = listSavedFazendas; window.confirmSaveAction = confirmSaveAction; window.loadSelectedSlot = loadSelectedSlot;
    })();
  </script>
</body>
</html>
