<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ajuda | Reserva Araras</title>
  <style>
    :root{--ink:#17362e;--forest:#245747;--forest2:#367565;--paper:#fffdf8;--cream:#f5f1e7;--line:#d9ded2;--gold:#d5a84f;--muted:#687a73;--shadow:0 18px 45px rgba(22,51,43,.16)}*{box-sizing:border-box}body{display:grid;place-items:center;margin:0;min-height:100vh;padding:1rem;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.dialog{width:min(760px,100%);min-height:min(620px,calc(100vh - 2rem));margin:auto;display:grid;grid-template-rows:auto 1fr;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1.35rem 1.5rem;border-bottom:1px solid var(--line)}.eyebrow{margin:0;color:var(--forest2);font-size:.68rem;font-weight:800;letter-spacing:.14em}.header h1{margin:.2rem 0 0;font:600 1.65rem Georgia,serif}.close{border:0;border-radius:50%;width:34px;height:34px;background:#edf0e9;color:var(--ink);font-size:1.25rem;cursor:pointer}.body{display:grid;grid-template-columns:230px 1fr;min-height:0}.topics{padding:1rem;border-right:1px solid var(--line);overflow:auto}.search{width:100%;border:1px solid #cbd5cc;border-radius:9px;padding:.65rem .75rem;background:#fff;color:var(--ink);margin-bottom:.75rem}.topic-list{display:grid;gap:.3rem}.topic{border:0;border-radius:9px;padding:.7rem;text-align:left;background:transparent;color:var(--ink);cursor:pointer}.topic:hover,.topic[aria-current=true]{background:#e7eee7;color:var(--forest);font-weight:800}.content{padding:1.5rem;overflow:auto}.content h2{margin:0 0 .6rem;font:600 1.55rem Georgia,serif}.content h3{font-size:1rem;margin:1.3rem 0 .35rem}.content p{color:var(--muted)}.content li{margin:.45rem 0}.callout{border-left:3px solid var(--gold);background:#f4efe1;border-radius:0 9px 9px 0;padding:.8rem;margin-top:1rem}.empty{color:var(--muted);padding:.5rem 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.close:focus-visible,.search:focus-visible,.topic:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:600px){.body{grid-template-columns:1fr}.topics{border-right:0;border-bottom:1px solid var(--line);max-height:210px}.topic-list{grid-template-columns:1fr 1fr}.content{padding:1rem}}
  </style>
</head>
<body>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle" data-component="help">
    <header class="header"><div><p class="eyebrow">GUIA DE CAMPO</p><h1 id="helpTitle">Como investigar na reserva</h1></div><button class="close" type="button" aria-label="Fechar ajuda" data-action="close">×</button></header>
    <div class="body"><aside class="topics" aria-label="Tópicos de ajuda"><label class="sr-only" for="helpSearch">Buscar ajuda</label><input id="helpSearch" class="search" type="search" placeholder="Buscar um tópico" autocomplete="off"><nav id="helpIndex" class="topic-list"></nav></aside><article id="helpContent" class="content" tabindex="-1"></article></div>
  </section>
  <script>
    (() => {
      'use strict';
      const topics = {
        ciclo: { title: 'O ciclo de investigação', intro: 'A reserva ajuda a transformar uma pergunta em uma comparação observável.', sections: [['Passo a passo', ['Faça uma pergunta.', 'Registre uma hipótese antes da primeira intervenção.', 'Mude uma parcela e observe os indicadores.', 'Explique o que mudou e planeje o próximo teste.']], ['Dica', ['Mude uma variável por vez para que a comparação fique mais clara.']]] },
        mapa: { title: 'Ler o mapa', intro: 'Cada parcela representa uma escolha dentro de um modelo simplificado do Cerrado.', sections: [['Legenda', ['Cerrado nativo favorece regeneração e permeabilidade.', 'SAF combina produção e cobertura do solo.', 'Reserva legal prioriza proteção e carbono.', 'Nascente é uma zona sensível que não pode ser removida.']]] },
        indicadores: { title: 'Entender os indicadores', intro: 'Os números descrevem o modelo; eles não são nota do estudante.', sections: [['O que comparar', ['Conservação mostra a proporção de parcelas protetivas.', 'Carbono e produção são estimativas didáticas.', 'Orçamento registra o custo das intervenções.']], ['Pergunta útil', ['Qual indicador mudou? O que na sua escolha pode explicar essa mudança?']]] },
        salvar: { title: 'Salvar e abrir atividades', intro: 'O botão “Salvar atividade” guarda uma versão da sua investigação.', sections: [['Cuidados', ['Escolha um nome que ajude a reconhecer o teste.', 'Registre a explicação no caderno antes de salvar.', 'Abrir uma atividade pode substituir o mapa que está na tela.']]] },
        limites: { title: 'Limites da simulação', intro: 'Este ambiente é um modelo para aprender a argumentar com evidências.', sections: [['Lembre-se', ['Ele não substitui observação de campo, comunidade ou orientação técnica.', 'Um resultado alto não é uma recomendação ambiental real.', 'Pergunte também o que o modelo não representa.']] ] }
      };
      const index = document.querySelector('#helpIndex'); const content = document.querySelector('#helpContent'); const search = document.querySelector('#helpSearch'); let current = 'ciclo';
      function renderHelpIndex(filter = '') { const query = filter.trim().toLocaleLowerCase(); index.replaceChildren(); Object.entries(topics).filter(([, topic]) => !query || topic.title.toLocaleLowerCase().includes(query) || topic.intro.toLocaleLowerCase().includes(query)).forEach(([id, topic]) => { const button = document.createElement('button'); button.className = 'topic'; button.type = 'button'; button.textContent = topic.title; button.setAttribute('aria-current', id === current ? 'true' : 'false'); button.dataset.topic = id; index.appendChild(button); }); if (!index.children.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'Nenhum tópico encontrado.'; index.appendChild(empty); } }
      function showHelpTopic(topicId) { const topic = topics[topicId] || topics.ciclo; current = topics[topicId] ? topicId : 'ciclo'; content.replaceChildren(); const title = document.createElement('h2'); title.textContent = topic.title; content.appendChild(title); const intro = document.createElement('p'); intro.textContent = topic.intro; content.appendChild(intro); topic.sections.forEach(([heading, items]) => { const h3 = document.createElement('h3'); h3.textContent = heading; content.appendChild(h3); const list = document.createElement('ul'); items.forEach(item => { const li = document.createElement('li'); li.textContent = item; list.appendChild(li); }); content.appendChild(list); }); if (current === 'limites') { const callout = document.createElement('p'); callout.className = 'callout'; callout.textContent = 'Converse com a professora ou com o professor sobre quais evidências seriam necessárias fora da tela.'; content.appendChild(callout); } renderHelpIndex(search.value); content.focus(); }
      function closeHelp() { window.dispatchEvent(new CustomEvent('reserva:help-close')); }
      index.addEventListener('click', event => { const button = event.target.closest('[data-topic]'); if (button) showHelpTopic(button.dataset.topic); }); search.addEventListener('input', () => renderHelpIndex(search.value)); document.addEventListener('click', event => { if (event.target.closest('[data-action="close"]')) closeHelp(); }); renderHelpIndex(); showHelpTopic(current);
      window.ReservaHelp = { renderHelpIndex, showHelpTopic, closeHelp }; window.renderHelpIndex = renderHelpIndex; window.showHelpTopic = showHelpTopic; window.closeHelp = closeHelp;
    })();
  </script>
</body>
</html>
