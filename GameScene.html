<section class="game-scene" data-game-scene aria-label="Cenário inicial do jogo">
  <div class="game-scene__world" tabindex="0" role="application" aria-label="Use as setas ou WASD para mover o avatar">
    <img class="game-scene__map" alt="Cenário principal do jogo" hidden>
    <div class="game-scene__avatar" role="img" aria-label="Avatar do jogador"></div>
    <p class="game-scene__hint">Explore com <kbd>← ↑ ↓ →</kbd> ou <kbd>WASD</kbd></p>
  </div>
</section>
<style>
  .game-scene{margin:0 0 1rem}.game-scene__world{position:relative;min-height:170px;overflow:hidden;border:2px solid #2e7d5b;border-radius:14px;background:linear-gradient(135deg,#c9edd8,#7bc9d0);outline-offset:3px}.game-scene__map{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.game-scene__avatar{position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;background:#285c48 center/contain no-repeat;box-shadow:0 2px 8px #1238;z-index:1}.game-scene__hint{position:absolute;right:.5rem;bottom:.35rem;z-index:2;margin:0;padding:.25rem .45rem;border-radius:5px;background:#ffffffe6;color:#173a2e;font:600 .75rem system-ui}.game-scene kbd{padding:0 .18rem;border:1px solid #97a69f;border-radius:3px;background:#fff}
</style>
<script>
(function () {
  var scene = document.currentScript.previousElementSibling.previousElementSibling;
  var world = scene.querySelector('.game-scene__world'), map = scene.querySelector('.game-scene__map'), avatar = scene.querySelector('.game-scene__avatar');
  var pos = { x: 50, y: 50 }, step = 7;
  function render() { avatar.style.left = pos.x + '%'; avatar.style.top = pos.y + '%'; }
  function move(key) {
    var delta = {ArrowLeft:[-step,0],a:[-step,0],A:[-step,0],ArrowRight:[step,0],d:[step,0],D:[step,0],ArrowUp:[0,-step],w:[0,-step],W:[0,-step],ArrowDown:[0,step],s:[0,step],S:[0,step]}[key];
    if (!delta) return false;
    pos.x = Math.max(4, Math.min(96, pos.x + delta[0])); pos.y = Math.max(13, Math.min(87, pos.y + delta[1])); render(); return true;
  }
  if (window.__gameSceneKeyController) window.__gameSceneKeyController.abort();
  window.__gameSceneKeyController = new AbortController();
  var keyOptions = { signal: window.__gameSceneKeyController.signal };
  world.addEventListener('keydown', function (event) { if (move(event.key)) event.preventDefault(); }, keyOptions);
  document.addEventListener('keydown', function (event) {
    if (world.contains(event.target)) return;
    var tag = (event.target && event.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (move(event.key)) event.preventDefault();
  }, keyOptions);
  function applyAssetManifest(manifest) {
    manifest = manifest || {};
    var names = manifest.requiredFiles || manifest.expectedFiles || [];
    var assets = manifest.assets || {};
    if (assets[names[0]]) { map.src = assets[names[0]]; map.hidden = false; }
    if (assets[names[1]]) avatar.style.backgroundImage = 'url("' + assets[names[1]] + '")';
    var missing = manifest.missingRequiredFiles || names.filter(function (name) { return !assets[name]; });
    world.dataset.assetsReady = missing.length ? 'false' : 'true';
    world.dataset.assetProject = manifest.project || '';
    if (missing.length || manifest.error) {
      world.setAttribute('aria-label', manifest.error || ('Cenário pronto; faltam no Drive: ' + missing.join(', ')));
    }
    window.__gameAssetManifest = manifest;
    window.dispatchEvent(new CustomEvent('gameassetsready', { detail: manifest }));
  }
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(applyAssetManifest).withFailureHandler(function (error) {
      var detail = error && error.message ? ': ' + error.message : '.';
      world.dataset.assetsReady = 'false';
      world.setAttribute('aria-label', 'Cenário local pronto; os assets do Drive não puderam ser carregados' + detail);
    }).getGameAssetManifest();
  }
  render();
})();
</script>
