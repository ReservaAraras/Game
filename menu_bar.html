<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu | Reserva Araras</title>
  <style>
    :root{--ink:#17362e;--forest:#245747;--paper:#fffdf8;--cream:#f5f1e7;--line:#d9ded2;--gold:#d5a84f;--muted:#687a73;--shadow:0 12px 28px rgba(22,51,43,.15)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:1rem;background:var(--cream);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.bar{width:min(760px,100%);margin:auto;display:flex;align-items:center;gap:1rem;padding:.7rem 1rem;background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.brand{font:600 1.15rem Georgia,serif;white-space:nowrap}.menu{display:flex;gap:.35rem;flex-wrap:wrap}.menu-group{position:relative}.menu-button,.menu-item{border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer}.menu-button{padding:.55rem .7rem;border-radius:8px;font-weight:800}.menu-button:hover,.menu-button[aria-expanded=true]{background:#e7eee7;color:var(--forest)}.menu-list{position:absolute;z-index:3;top:calc(100% + .35rem);left:0;min-width:180px;padding:.35rem;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.menu-list[hidden]{display:none}.menu-item{display:block;width:100%;padding:.6rem .7rem;text-align:left;border-radius:7px}.menu-item:hover{background:#e7eee7}.status{margin-left:auto;color:var(--muted);font-size:.78rem}.menu-button:focus-visible,.menu-item:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:560px){.bar{align-items:flex-start;flex-direction:column}.status{margin-left:0}}
  </style>
</head>
<body>
  <nav class="bar" aria-label="Menu principal" data-component="menu"><strong class="brand">Reserva Araras</strong><div id="mainMenu" class="menu"></div><span id="menuStatus" class="status" role="status" aria-live="polite">Pronto</span></nav>
  <script>
    (() => {
      'use strict';
      const menus = [{ id: 'activity', label: 'Atividade', items: [{ id: 'save', label: 'Salvar atividade' }, { id: 'saves', label: 'Abrir atividades' }] }, { id: 'investigation', label: 'Investigar', items: [{ id: 'study', label: 'Abrir caderno' }, { id: 'guide', label: 'Roteiro docente' }] }, { id: 'support', label: 'Apoio', items: [{ id: 'help', label: 'Como funciona' }, { id: 'settings', label: 'Configurações' }] }];
      const menu = document.querySelector('#mainMenu'); const status = document.querySelector('#menuStatus'); let openId = null;
      function createMainMenu() { menu.replaceChildren(); menus.forEach(group => { const wrapper = document.createElement('div'); wrapper.className = 'menu-group'; const button = document.createElement('button'); button.className = 'menu-button'; button.type = 'button'; button.textContent = group.label; button.dataset.menu = group.id; button.setAttribute('aria-haspopup', 'true'); button.setAttribute('aria-expanded', 'false'); const list = document.createElement('div'); list.className = 'menu-list'; list.hidden = true; list.id = `menu-${group.id}`; group.items.forEach(item => { const itemButton = document.createElement('button'); itemButton.className = 'menu-item'; itemButton.type = 'button'; itemButton.textContent = item.label; itemButton.dataset.action = item.id; list.appendChild(itemButton); }); wrapper.append(button, list); menu.appendChild(wrapper); }); }
      function openDropdownMenu(menuId, button) { const list = document.querySelector(`#menu-${menuId}`); if (!list) return; const shouldOpen = openId !== menuId; document.querySelectorAll('.menu-list').forEach(item => { item.hidden = true; }); document.querySelectorAll('.menu-button').forEach(item => item.setAttribute('aria-expanded', 'false')); if (shouldOpen) { list.hidden = false; button.setAttribute('aria-expanded', 'true'); openId = menuId; } else openId = null; }
      function handleMenuAction(action) { openId = null; document.querySelectorAll('.menu-list').forEach(item => { item.hidden = true; }); document.querySelectorAll('.menu-button').forEach(item => item.setAttribute('aria-expanded', 'false')); status.textContent = `Ação: ${action}`; window.dispatchEvent(new CustomEvent('reserva:menu-action', { detail: { action } })); }
      menu.addEventListener('click', event => { const menuButton = event.target.closest('[data-menu]'); const actionButton = event.target.closest('[data-action]'); if (menuButton) openDropdownMenu(menuButton.dataset.menu, menuButton); if (actionButton) handleMenuAction(actionButton.dataset.action); }); document.addEventListener('click', event => { if (!event.target.closest('.menu-group')) { openId = null; document.querySelectorAll('.menu-list').forEach(item => { item.hidden = true; }); } }); document.addEventListener('keydown', event => { if (event.key === 'Escape') { openId = null; document.querySelectorAll('.menu-list').forEach(item => { item.hidden = true; }); } }); createMainMenu();
      window.ReservaMenu = { createMainMenu, openDropdownMenu, handleMenuAction }; window.createMainMenu = createMainMenu; window.openDropdownMenu = openDropdownMenu; window.handleMenuAction = handleMenuAction;
    })();
  </script>
</body>
</html>
