<style>

.inspector h2{font:600 1.55rem Georgia,serif;margin:.3rem 0}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1.2rem 0}.metric-grid article{padding:.8rem;border:1px solid var(--line);border-radius:10px;display:grid;background:#fbfcf7}.metric-grid small{font-size:.6rem;color:#71817a;font-weight:800}.metric-grid strong{font:600 1.25rem Georgia,serif;margin:.25rem 0}.metric-grid span{font-size:.65rem;color:#7c8983}.progress-block{padding:1rem 0}.progress-block>div:first-child{display:flex;justify-content:space-between;font-size:.78rem}.progress{height:7px;border-radius:7px;background:#dfe4db;margin-top:.5rem;overflow:hidden}.progress i{display:block;height:100%;width:60%;background:linear-gradient(90deg,var(--gold),var(--leaf));transition:.3s}.parcel-card,.tip{border-radius:11px;padding:1rem;margin-top:1rem}.parcel-card{border:1px solid var(--line);min-height:130px}.parcel-card h3{font:600 1.1rem Georgia,serif;margin:.35rem 0}.parcel-card p,.tip p{font-size:.76rem;line-height:1.5;color:#6c7c74}.tip{background:#e5ecdc;border-left:3px solid var(--leaf)}.tip strong{font-size:.78rem}

.modal{position:fixed;inset:0;background:rgba(17,43,35,.64);display:grid;place-items:center;padding:1rem;z-index:30}.modal-card{position:relative;width:min(650px,100%);max-height:85vh;overflow:auto;background:var(--paper);border-radius:16px;padding:1.5rem;box-shadow:var(--shadow)}.modal-close{position:absolute;right:1rem;top:1rem;border:0;background:#edf0e9;border-radius:50%;width:32px;height:32px;font-size:1.2rem}.modal h2{font:600 1.7rem Georgia,serif;margin:.2rem 0 1rem}.save-list,.asset-list{display:grid;gap:.6rem}.save-row,.asset-row{border:1px solid var(--line);padding:.8rem;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:1rem}.save-row>div,.asset-row>div{display:grid}.save-row small,.asset-row small{color:#77857e}.row-actions{display:flex;gap:.4rem}.row-actions button{border:0;border-radius:7px;padding:.5rem;background:#e3e9df}.asset-preview{max-width:100%;max-height:330px;display:block;margin:1rem auto;border-radius:8px}.toasts{position:fixed;right:1rem;bottom:1rem;z-index:50;display:grid;gap:.6rem}.toast{background:var(--ink);color:#fff;padding:.75rem 1rem;border-radius:9px;box-shadow:var(--shadow);animation:toastIn .2s}.toast.error{background:#923e2c}@keyframes toastIn{from{transform:translateY(8px);opacity:0}}
@media(max-width:1050px){.workspace{grid-template-columns:210px 1fr}.inspector{grid-column:1/-1;border-top:1px solid var(--line)}.metric-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:720px){.auth{grid-template-columns:1fr}.auth-visual{display:none}.auth-panel{min-height:100vh;padding:1.5rem}.workspace{display:block;height:auto}.sidebar{border:0}.sidebar nav{display:grid;grid-template-columns:1fr 1fr}.map-area{padding:1rem}.inspector{border:0}.metric-grid,.comparison-grid{grid-template-columns:1fr 1fr}.save-status,.topbar [data-action="guide"],.topbar [data-action="assets"]{display:none}}

/* Contrato UX compartilhado: foco, estados, toque e redução de movimento. */
:root{--ux-control-height:44px;--ux-radius:12px;--ux-focus:#d5a84f}html{scroll-padding-top:20px}
:where(button,a[href],[role="button"]){touch-action:manipulation}
:where(button,a[href],[role="button"],input,select,textarea){min-height:var(--ux-control-height)}
:where(button,a[href],[role="button"],input,select,textarea):focus-visible{outline:3px solid var(--ux-focus);outline-offset:3px}
:where(button:disabled,input:disabled,select:disabled,textarea:disabled){cursor:not-allowed;opacity:.68}:where([aria-busy="true"],.is-loading,.loading-state){cursor:progress}
:where(button:not(:disabled),[role="button"],.button,.tool):active{transform:translateY(1px)}
:where(.card,.panel,.modal-card,.modal-content,.dialog-content){border-radius:max(var(--ux-radius),12px)}
:where(.toast,.alert,[role="alert"],[role="status"]){overflow-wrap:anywhere}
@media(max-width:640px){:where(.actions,.button-row,.form-actions,.modal-actions,.header-actions,.top-actions){gap:10px;flex-wrap:wrap}:where(.card,.panel,.modal-card,.modal-content,.dialog-content){max-width:calc(100vw - 24px)}:where(input,select,textarea){font-size:max(16px,1rem)}}
@media(prefers-reduced-motion:reduce){:where(*,*::before,*::after){animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
<script>
  (function () {
    function bindEscape() {
      if (document.documentElement.dataset.uxEscapeBound === 'true') return;
      document.documentElement.dataset.uxEscapeBound = 'true';
      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        var dialog = document.querySelector('dialog[open], [role="dialog"]:not([hidden]), .modal:not(.hidden), .modal[aria-hidden="false"]');
        var close = dialog && dialog.querySelector('[data-action="close-modal"], [data-close], .modal-close, .close, [aria-label*="Fechar" i]');
        if (close && !close.disabled) { event.preventDefault(); close.click(); }
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindEscape, { once: true });
    else bindEscape();
  }());
</script>
