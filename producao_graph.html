<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produção | Reserva Araras</title>
  <style>
    :root{--ink:#17362e;--forest:#245747;--leaf:#83a95d;--paper:#fffdf8;--cream:#f5f1e7;--line:#d9ded2;--gold:#d5a84f;--muted:#687a73;--shadow:0 18px 45px rgba(22,51,43,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:1rem;background:var(--cream);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(760px,100%);margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.4rem;box-shadow:var(--shadow)}.eyebrow{margin:0;color:#367565;font-size:.68rem;font-weight:800;letter-spacing:.14em}.card h1{margin:.2rem 0 .3rem;font:600 1.6rem Georgia,serif}.muted{color:var(--muted)}.chart-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fbfcf7}.chart{display:block;min-width:560px;width:100%;height:280px}.axis{stroke:#b8c5b8;stroke-width:1}.line-production{fill:none;stroke:var(--forest);stroke-width:3}.line-conservation{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:6 5}.point{fill:var(--paper);stroke:var(--forest);stroke-width:2}.legend{display:flex;gap:1rem;margin:.8rem 0;color:var(--muted);font-size:.75rem}.legend i{display:inline-block;width:22px;border-top:3px solid var(--forest);vertical-align:middle;margin-right:.3rem}.legend .conservation{border-color:var(--gold);border-top-style:dashed}.table{width:100%;border-collapse:collapse;margin-top:.8rem;font-size:.8rem}.table th,.table td{text-align:right;padding:.55rem;border-bottom:1px solid var(--line)}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--muted);font-size:.7rem}.chart-wrap:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  </style>
</head>
<body>
  <section class="card" data-component="production-graph"><p class="eyebrow">CICLOS DA INVESTIGAÇÃO</p><h1>Evolução da produção</h1><p class="muted">A linha acompanha os pontos de produção do modelo e a conservação em porcentagem.</p><div class="chart-wrap" tabindex="0" role="img" aria-label="Gráfico de produção e conservação"><svg id="productionChart" class="chart" viewBox="0 0 700 280" aria-hidden="true"></svg></div><div class="legend"><span><i></i>Produção</span><span><i class="conservation"></i>Conservação</span></div><table class="table"><caption class="sr-only">Histórico de produção e conservação</caption><thead><tr><th>Ciclo</th><th>Produção</th><th>Conservação</th></tr></thead><tbody id="productionTable"></tbody></table></section>
  <script>
    (() => {
      'use strict';
      const defaultHistory = [{ cycle: 1, production: 0, conservation: 60 }, { cycle: 2, production: 12, conservation: 62 }, { cycle: 3, production: 24, conservation: 67 }, { cycle: 4, production: 29, conservation: 72 }]; const svg = document.querySelector('#productionChart'); const table = document.querySelector('#productionTable');
      function cleanHistory(history) { return (Array.isArray(history) && history.length ? history : defaultHistory).slice(-12).map(item => ({ cycle: String(item.cycle ?? ''), production: Math.max(0, Number(item.production) || 0), conservation: Math.max(0, Math.min(100, Number(item.conservation) || 0)) })); }
      function drawProducaoChart(history = defaultHistory) { const data = cleanHistory(history); const width = 700; const height = 280; const pad = { left: 44, right: 20, top: 20, bottom: 35 }; const maxProduction = Math.max(10, ...data.map(item => item.production)); const x = index => pad.left + (data.length === 1 ? 0 : index / (data.length - 1) * (width - pad.left - pad.right)); const yProduction = value => height - pad.bottom - value / maxProduction * (height - pad.top - pad.bottom); const yConservation = value => height - pad.bottom - value / 100 * (height - pad.top - pad.bottom); svg.replaceChildren(); const axis = document.createElementNS('http://www.w3.org/2000/svg', 'path'); axis.classList.add('axis'); axis.setAttribute('d', `M${pad.left} ${pad.top}V${height - pad.bottom}H${width - pad.right}`); svg.appendChild(axis); const productionLine = document.createElementNS('http://www.w3.org/2000/svg', 'polyline'); productionLine.classList.add('line-production'); productionLine.setAttribute('points', data.map((item, index) => `${x(index)},${yProduction(item.production)}`).join(' ')); svg.appendChild(productionLine); const conservationLine = document.createElementNS('http://www.w3.org/2000/svg', 'polyline'); conservationLine.classList.add('line-conservation'); conservationLine.setAttribute('points', data.map((item, index) => `${x(index)},${yConservation(item.conservation)}`).join(' ')); svg.appendChild(conservationLine); data.forEach((item, index) => { const point = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); point.classList.add('point'); point.setAttribute('cx', x(index)); point.setAttribute('cy', yProduction(item.production)); point.setAttribute('r', 4); point.setAttribute('aria-label', `Ciclo ${item.cycle}: produção ${item.production}`); svg.appendChild(point); const label = document.createElementNS('http://www.w3.org/2000/svg', 'text'); label.setAttribute('x', x(index)); label.setAttribute('y', height - 12); label.setAttribute('text-anchor', 'middle'); label.setAttribute('fill', '#687a73'); label.setAttribute('font-size', '12'); label.textContent = item.cycle; svg.appendChild(label); const row = document.createElement('tr'); [item.cycle, item.production, `${item.conservation}%`].forEach(value => { const cell = document.createElement('td'); cell.textContent = String(value); row.appendChild(cell); }); table.appendChild(row); }); return data; }
      function highlightMilestone(cycle) { const cells = [...table.querySelectorAll('tr')]; cells.forEach(row => row.removeAttribute('data-highlight')); const row = cells.find(item => item.firstElementChild?.textContent === String(cycle)); if (row) { row.dataset.highlight = 'true'; row.scrollIntoView({ block: 'nearest' }); } return Boolean(row); }
      function updateChartOnTick(history) { return drawProducaoChart(history); }
      drawProducaoChart(); window.ReservaProductionGraph = { drawProducaoChart, highlightMilestone, updateChartOnTick }; window.drawProducaoChart = drawProducaoChart; window.highlightMilestone = highlightMilestone; window.updateChartOnTick = updateChartOnTick;
    })();
  </script>
</body>
</html>
